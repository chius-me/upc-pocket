name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (SemVer, e.g. v0.2.0 or v0.2.0-rc.1)'
        required: true
        type: string
      version_code:
        description: 'Optional integer Android versionCode / iOS build number (defaults to github.run_number)'
        required: false
        type: string
      prerelease:
        description: 'Mark GitHub Release as prerelease (auto-true when version has hyphen suffix)'
        required: false
        default: false
        type: boolean
      publish_testflight:
        description: 'Upload signed IPA to TestFlight via App Store Connect API (requires ASC secrets & signed iOS)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate Tag & Security Baseline
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run security baseline check
        run: bash scripts/check_security_baseline.sh

      - name: Resolve and validate release metadata
        id: meta
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          INPUT_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '' }}
          INPUT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["INPUT_TAG"].strip()
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)", tag)
          if not match:
              sys.exit(f"Invalid release tag '{tag}'. Expected SemVer like v0.2.0 or v0.2.0-rc.1")

          version_name = match.group(1)
          raw_code = os.environ["INPUT_VERSION_CODE"].strip()
          if raw_code:
              if not re.fullmatch(r"[1-9][0-9]*", raw_code):
                  sys.exit(f"Invalid version_code '{raw_code}'. Must be a positive integer.")
              version_code = raw_code
          else:
              gradle_text = pathlib.Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
              gradle_match = re.search(r"val\s+resolvedVersionCode[\s\S]*?\?:\s*([1-9][0-9]*)", gradle_text)
              gradle_code = int(gradle_match.group(1)) if gradle_match else 3
              version_code = str(max(gradle_code, 2 + int(os.environ["RUN_NUMBER"])))

          is_prerelease = (os.environ["INPUT_PRERELEASE"].lower() == "true") or ("-" in version_name)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"version_name={version_name}\n")
              out.write(f"version_code={version_code}\n")
              out.write(f"is_prerelease={'true' if is_prerelease else 'false'}\n")

          print(f"Prepared release: tag={tag}, version_name={version_name}, version_code={version_code}, prerelease={is_prerelease}")
          PY

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      signed: ${{ steps.android_build.outputs.signed }}
      apk_name: ${{ steps.android_build.outputs.apk_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android Release APK (and AAB when signed)
        id: android_build
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist-android
          chmod +x android/gradlew
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Configuring signed Android release build..."
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$KEY_PASS"
            (
              cd android
              ./gradlew :app:assembleRelease :app:bundleRelease \
                -PrequireReleaseSigning=true \
                "-PappVersionName=${VERSION_NAME}" \
                "-PappVersionCode=${VERSION_CODE}" \
                --no-daemon --stacktrace
            )
            APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
            AAB_SRC=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
            if [ -z "$APK_SRC" ] || [ -z "$AAB_SRC" ]; then
              echo "Missing expected signed APK or AAB" >&2
              exit 1
            fi
            APKSIGNER=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK_SRC"
            fi
            OUT_APK="UPCPocket-android-v${VERSION_NAME}-universal.apk"
            OUT_AAB="UPCPocket-android-v${VERSION_NAME}.aab"
            cp "$APK_SRC" "dist-android/${OUT_APK}"
            cp "$AAB_SRC" "dist-android/${OUT_AAB}"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "apk_name=${OUT_APK}" >> "$GITHUB_OUTPUT"
          else
            echo "Android signing secrets not configured; producing explicitly unsigned R8 release APK."
            (
              cd android
              ./gradlew :app:assembleRelease \
                "-PappVersionName=${VERSION_NAME}" \
                "-PappVersionCode=${VERSION_CODE}" \
                --no-daemon --stacktrace
            )
            APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            if [ ! -f "$APK_SRC" ]; then
              echo "Expected unsigned release APK at $APK_SRC" >&2
              exit 1
            fi
            OUT_APK="UPCPocket-android-v${VERSION_NAME}-unsigned.apk"
            cp "$APK_SRC" "dist-android/${OUT_APK}"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "apk_name=${OUT_APK}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean temporary Android keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-assets
          retention-days: 7
          path: dist-android/*

  build-ios:
    name: Build iOS Release
    runs-on: macos-26
    needs: prepare
    outputs:
      signed: ${{ steps.ios_build.outputs.signed }}
      ipa_name: ${{ steps.ios_build.outputs.ipa_name }}
      testflight_uploaded: ${{ steps.testflight.outputs.uploaded || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select latest available Xcode
        run: |
          BEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)
          if [ -z "$BEST_XCODE" ]; then
            BEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -n "$BEST_XCODE" ]; then
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project and run XCTests
        working-directory: ios
        run: |
          plutil -lint UPCPocket/Resources/Info.plist
          xcodegen generate
          SIM_ID=$(python3 ../scripts/select_ios_simulator.py --id-only)
          xcodebuild \
            -project UPCPocket.xcodeproj \
            -scheme UPCPocket \
            -destination "platform=iOS Simulator,id=${SIM_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Archive and package iOS Release IPA
        id: ios_build
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          mkdir -p dist-ios
          MARKETING_VER="${VERSION_NAME%%-*}"
          if [ -n "$CERT_B64" ] && [ -n "$CERT_PASS" ] && [ -n "$PROFILE_B64" ] && [ -n "$TEAM_ID" ]; then
            echo "Configuring signed iOS archive & export..."
            KEYCHAIN_PATH="$RUNNER_TEMP/upc-build.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            CERT_PATH="$RUNNER_TEMP/ios-dist.p12"
            PROFILE_PATH="$RUNNER_TEMP/ios-dist.mobileprovision"

            printf '%s' "$CERT_B64" | base64 --decode > "$CERT_PATH"
            printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

            PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

            ARCHIVE_PATH="$RUNNER_TEMP/UPCPocket.xcarchive"
            EXPORT_DIR="$RUNNER_TEMP/ios-export"
            EXPORT_OPTS="$RUNNER_TEMP/ExportOptions.plist"
            METHOD="${EXPORT_METHOD:-app-store-connect}"

            cat > "$EXPORT_OPTS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${METHOD}</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>me.chius.upcpocket</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

            RESOLVED_SIGN_IDENTITY="${SIGN_IDENTITY:-Apple Distribution}"
            xcodebuild \
              -project ios/UPCPocket.xcodeproj \
              -scheme UPCPocket \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              MARKETING_VERSION="$MARKETING_VER" \
              CURRENT_PROJECT_VERSION="$VERSION_CODE" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$RESOLVED_SIGN_IDENTITY" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              archive

            xcodebuild \
              -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist "$EXPORT_OPTS" \
              -exportPath "$EXPORT_DIR"

            IPA_SRC=$(find "$EXPORT_DIR" -name "*.ipa" | head -n 1)
            if [ -z "$IPA_SRC" ]; then
              echo "Expected signed IPA under $EXPORT_DIR" >&2
              exit 1
            fi
            OUT_IPA="UPCPocket-ios-v${VERSION_NAME}.ipa"
            cp "$IPA_SRC" "dist-ios/${OUT_IPA}"
            if [ -d "$ARCHIVE_PATH/dSYMs" ]; then
              (cd "$ARCHIVE_PATH/dSYMs" && zip -qry "$GITHUB_WORKSPACE/dist-ios/UPCPocket-ios-v${VERSION_NAME}-dSYM.zip" .)
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "ipa_name=${OUT_IPA}" >> "$GITHUB_OUTPUT"
          else
            echo "iOS signing secrets not configured; producing unsigned IPA archive for verification."
            ARCHIVE_PATH="$RUNNER_TEMP/UPCPocket.xcarchive"
            xcodebuild \
              -project ios/UPCPocket.xcodeproj \
              -scheme UPCPocket \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              MARKETING_VERSION="$MARKETING_VER" \
              CURRENT_PROJECT_VERSION="$VERSION_CODE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              archive

            PAYLOAD_ROOT="$RUNNER_TEMP/unsigned-ipa/Payload"
            mkdir -p "$PAYLOAD_ROOT"
            cp -R "$ARCHIVE_PATH/Products/Applications/UPCPocket.app" "$PAYLOAD_ROOT/"
            OUT_IPA="UPCPocket-ios-v${VERSION_NAME}-unsigned.ipa"
            (cd "$RUNNER_TEMP/unsigned-ipa" && zip -qry "$GITHUB_WORKSPACE/dist-ios/${OUT_IPA}" Payload)
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "ipa_name=${OUT_IPA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload signed IPA to TestFlight (optional)
        id: testflight
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_testflight == true &&
          steps.ios_build.outputs.signed == 'true'
        env:
          IPA_NAME: ${{ steps.ios_build.outputs.ipa_name }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_B64" ]; then
            echo "TestFlight upload skipped: App Store Connect API secrets not configured." >&2
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYS_DIR"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            -f "dist-ios/${IPA_NAME}" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Clean temporary iOS signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/upc-build.keychain-db" 2>/dev/null || true
          security list-keychains -d user -s login.keychain-db 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/ios-dist.p12" "$RUNNER_TEMP/ios-dist.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8 2>/dev/null || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true

      - name: Upload iOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-assets
          retention-days: 7
          path: dist-ios/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-android
      - build-ios
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Prepare release bundle, checksums, and release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          ANDROID_SIGNED: ${{ needs.build-android.outputs.signed }}
          ANDROID_APK: ${{ needs.build-android.outputs.apk_name }}
          IOS_SIGNED: ${{ needs.build-ios.outputs.signed }}
          IOS_IPA: ${{ needs.build-ios.outputs.ipa_name }}
          TESTFLIGHT_UPLOADED: ${{ needs.build-ios.outputs.testflight_uploaded }}
        run: |
          mkdir -p release-assets
          find release-artifacts -type f -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

          ANDROID_STATUS="未配置签名 Secret（unsigned，仅 CI 验证）"
          if [ "$ANDROID_SIGNED" = "true" ]; then
            ANDROID_STATUS="已正式签名（APK + AAB）"
          fi

          IOS_STATUS="未配置签名 Secret（unsigned IPA，仅归档结构验证）"
          if [ "$IOS_SIGNED" = "true" ]; then
            IOS_STATUS="已签名导出"
            if [ "$TESTFLIGHT_UPLOADED" = "true" ]; then
              IOS_STATUS="${IOS_STATUS} · 已上传 TestFlight"
            fi
          fi

          cat > release-body.md <<EOF
          ## UPC Pocket ${TAG}

          - **版本号**：\`${VERSION_NAME}\`（build \`${VERSION_CODE}\`）
          - **Android APK 直链下载**：[${ANDROID_APK}](https://github.com/${REPO}/releases/download/${TAG}/${ANDROID_APK})
          - **安全基线门禁**：已通过 \`scripts/check_security_baseline.sh\`（禁用云备份、精确两主机明文例外、无明文密钥入库）

          ### 构建产物状态

          | 平台 | 产物 | 状态 |
          | --- | --- | --- |
          | Android | \`${ANDROID_APK}\` | ${ANDROID_STATUS} |
          | iOS | \`${IOS_IPA}\` | ${IOS_STATUS} |

          ### SHA-256 校验摘要

          \`\`\`text
          $(cat release-assets/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: UPC Pocket ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body_path: release-body.md
          files: |
            release-assets/*
